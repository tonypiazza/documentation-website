# nginx config for the Migration Assistant docs team-review preview.
# Serves the static Jekyll build and redirects the site root to the
# Migration Assistant landing page.
server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Land visitors on the Migration Assistant docs instead of the site root.
    # A server-side redirect is avoided on purpose: behind the Aiven TLS proxy
    # the forwarded Host carries :8080 and the scheme is http, so nginx builds a
    # broken http://host:8080/... Location. Instead serve a tiny root index.html
    # that redirects client-side using the browser's own origin (correct scheme,
    # no port). See deploy-preview/root-index.html (copied to the web root).
    location = / {
        try_files /index.html =404;
    }

    # Jekyll builds directory-style URLs (/path/ -> /path/index.html).
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Long-cache static assets; the SVGs and CSS are content-stable per build.
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
