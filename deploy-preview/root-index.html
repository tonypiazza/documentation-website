<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Client-side redirect to the Migration Assistant docs. Uses the browser's
       own origin, so it works behind the Aiven TLS proxy without a server-side
       Location header (which would leak http + :8080). -->
  <meta http-equiv="refresh" content="0; url=/latest/migration-assistant/">
  <script>location.replace("/latest/migration-assistant/");</script>
  <title>Redirecting…</title>
</head>
<body>
  <p>Redirecting to the <a href="/latest/migration-assistant/">Migration Assistant documentation</a>…</p>
</body>
</html>
