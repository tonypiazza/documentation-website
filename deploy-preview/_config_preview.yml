# Jekyll config overlay for the review preview container.
# Layered on top of _config.yml at build time via jekyll build --config.
#
# url is emptied so every link is root-relative and resolves at whatever
# hostname Aiven assigns, with no hardcoded host. baseurl stays "/latest" so
# the built paths match the production layout (and the nginx root->/latest
# redirect).
url: ""
baseurl: "/latest"
